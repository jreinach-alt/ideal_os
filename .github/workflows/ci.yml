name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test suite (busybox ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install busybox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox-static

      - name: Run suite
        run: sh scripts/test.sh

  lint:
    name: ShellCheck + CRLF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Full output for humans; only error-severity findings gate the
      # build (the codebase carries documented style deviations, e.g.
      # cat|wc -c for missing-file semantics).
      - name: ShellCheck (report)
        run: shellcheck -x src/core/*.sh src/platforms/nextui/*.sh scripts/*.sh || true

      - name: ShellCheck (gate on errors)
        run: shellcheck -x --severity=error src/core/*.sh src/platforms/nextui/*.sh scripts/*.sh tools/saves-repo/*.sh tests/unit/*/*.sh tests/integration/*.sh tests/fixtures/*.sh

      # CRLF in a shipped script silently breaks exec on the device
      # (the kernel reads '#!/bin/sh\r' as the interpreter). The repo
      # forces LF via .gitattributes; this catches anything that slips
      # past (e.g. a binary-attributed file that is actually a script).
      - name: CRLF scan
        run: |
          bad=$(git ls-files -- '*.sh' '*.json' '*.md' '*.txt' ':!:upstream/**' | xargs grep -l "$(printf '\r')" 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "CRLF line endings found in:"; echo "$bad"; exit 1
          fi

  artifact-integrity:
    name: Shipped PAK integrity (qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu-user-static
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static

      # The committed PAK is what OTA serves to devices — its manifest
      # must match its bytes, and the binaries must actually execute.
      - name: Verify checksums manifest
        run: |
          cd build/Continuity.pak
          fail=0
          while read -r sum size path; do
            [ -n "$path" ] || continue
            actual_size=$(wc -c < "$path")
            actual_sum=$(sha256sum "$path" | cut -d' ' -f1)
            if [ "$actual_size" != "$size" ] || [ "$actual_sum" != "$sum" ]; then
              echo "MISMATCH: $path"; fail=1
            fi
          done < checksums.txt
          exit $fail

      - name: Vendored busybox validation matrix
        run: |
          if [ -f build/Continuity.pak/bin/busybox ]; then
            sh scripts/validate_busybox.sh build/Continuity.pak/bin/busybox
          else
            echo "no bin/busybox in PAK — skipping"
          fi

      - name: Bundled git executes under qemu
        run: qemu-aarch64-static build/Continuity.pak/bin/git --version

  # CI feedback over git transport: the GitHub API/connector is not
  # reliably reachable from dev sessions, but git always is. This job
  # attaches the run's conclusion as a git note on the tested commit;
  # any session verifies CI with scripts/ci_status.sh (plain fetch).
  report:
    name: Publish result as git note
    runs-on: ubuntu-latest
    needs: [test, lint, artifact-integrity]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach conclusion note to the tested commit
        env:
          R_TEST: ${{ needs.test.result }}
          R_LINT: ${{ needs.lint.result }}
          R_ART: ${{ needs.artifact-integrity.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          overall=success
          for r in "$R_TEST" "$R_LINT" "$R_ART"; do
            [ "$r" = "success" ] || overall=failure
          done
          git config user.name "continuity-ci"
          git config user.email "ci@continuity.invalid"
          note="$overall test=$R_TEST lint=$R_LINT artifact=$R_ART run=$RUN_ID at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # retry: concurrent runs race on the notes ref
          for attempt in 1 2 3; do
            git fetch -f origin '+refs/notes/ci:refs/notes/ci' 2>/dev/null || true
            git notes --ref ci add -f -m "$note" "$GITHUB_SHA"
            if git push origin refs/notes/ci; then
              exit 0
            fi
            sleep 3
          done
          echo "could not publish CI note" >&2
          exit 1
